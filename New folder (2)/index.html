const AUDIO_SRC="Until I Found You.mp3"; // 
// Oct 1, 2026 00:00 PKT (UTC+5) = Sep 30, 19:00 UTC
const TARGET=Date.UTC(2026,8,30,19,0,0);
const $=s=>document.querySelector(s);const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const preview=location.search.includes('preview');
/* particles */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[],amb=false,W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const cols=['#f4a9bf','#e77a9b','#fff','#e8b445','#f9d7e0'];
function add(t,x,y,vx,vy){P.push({t,x,y,vx,vy,r:4+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.06,c:cols[Math.random()*cols.length|0],l:0})}
function burst(n){if(RM)n=n/4;for(let i=0;i<n;i++)add('c',W/2,H*.45,(Math.random()-.5)*14,-Math.random()*13-3)}
function petals(n){for(let i=0;i<n;i++)add('p',Math.random()*W,-20,(Math.random()-.3)*.8,.6+Math.random()*1.2)}
function hearts(n){for(let i=0;i<n;i++)add('h',Math.random()*W,H+10,(Math.random()-.5)*.5,-.6-Math.random())}
function heartPath(r){cx.beginPath();cx.moveTo(0,r*.4);cx.bezierCurveTo(-r,-r*.4,-r*.4,-r,0,-r*.3);cx.bezierCurveTo(r*.4,-r,r,-r*.4,0,r*.4);cx.fill()}
function loop(){cx.clearRect(0,0,W,H);
 if(amb&&!RM&&P.length<45&&Math.random()<.08){Math.random()<.7?petals(1):hearts(1)}
 P=P.filter(p=>p.y<H+30&&p.y>-40&&p.l<900);
 for(const p of P){p.l++;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;if(p.t=='c')p.vy+=.25,p.vx*=.99;if(p.t=='p')p.x+=Math.sin(p.l/30)*.6;
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=p.t=='h'?.55:.85;
  if(p.t=='c')cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else if(p.t=='p'){cx.beginPath();cx.ellipse(0,0,p.r,p.r/2,0,0,7);cx.fillStyle='#f4a9bf';cx.fill()}else{cx.fillStyle='#e77a9b';heartPath(p.r)}
  cx.restore()}
 requestAnimationFrame(loop)}loop();
/* countdown */
const cd=$('#cd');function pad(n){return String(n).padStart(2,'0')}
let unlocked=false;
function tick(){const d=TARGET-Date.now();
 if(d<=0&&!unlocked||preview&&!unlocked){unlock(Date.now()-TARGET<5000||d>0&&false);return}
 if(unlocked)return;
 const s=Math.floor(d/1000);const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60],l=['days','hrs','min','sec'];
 cd.innerHTML=v.map((x,i)=>`<div><b>${pad(x)}</b><small>${l[i]}</small></div>`).join('')}
setInterval(tick,250);tick();
function unlock(live){unlocked=true;const lk=$('#lock');
 const show=()=>{lk.style.display='none';$('#stage').style.display='block';$('#mp').style.display='flex';window.scrollTo(0,0);
  burst(160);setTimeout(()=>burst(100),700);petals(20);hearts(10);amb=true;setTimeout(()=>{P.length&&0},0);typeLine()};
 if(live!==false&&!preview){lk.style.opacity=0;petals(30);setTimeout(show,2000)}else show()}
function typeLine(){const t="Bushesssss, I made a little world just for you… 🌸",e=$('#pre');let i=0;const f=()=>{if(i<=t.length){e.textContent=t.slice(0,i++);setTimeout(f,RM?0:45)}};f()}
/* cake */
const cn=$('#cn');[105,150,195].forEach(x=>{cn.innerHTML+=`<rect x="${x-4}" y="112" width="8" height="38" rx="3" fill="#fff" stroke="#e8b4c2"/><g class="flame"><ellipse cx="${x}" cy="102" rx="6" ry="11" fill="#ffc94d"/><ellipse cx="${x}" cy="105" rx="3" ry="6" fill="#fff4c4"/></g><path class="smoke" d="M${x} 108q-6-10 0-20t0-18" stroke="#bbb" fill="none" stroke-width="3" stroke-linecap="round"/>`});
let blown=false;
function blow(){if(blown)return;blown=true;$('#cake').classList.add('out');$('#hint').textContent='Make a wish, Bushesssss… 🤍';burst(200);setTimeout(()=>{$('#go').style.display='inline-block'},1200)}
$('#cake').addEventListener('click',blow);
$('#go').addEventListener('click',()=>{build();$('#main').style.display='block';setTimeout(()=>$('#main').scrollIntoView({behavior:'smooth'}),50)});
let built=false;
function build(){if(built)return;built=true;$('#mainc').appendChild($('#tpl').content.cloneNode(true));
 $('#gal').innerHTML=photos.map(p=>`<figure class="pol" style="margin:0"><div class="ph">${p.image?`<img src="${p.image}" alt="${p.caption}" loading="lazy">`:'📷<br>Photo yahan aayegi'}</div><p>${p.caption}</p></figure>`).join('');
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
 document.querySelectorAll('.rv').forEach(el=>io.observe(el))}
/* music */
const au=$('#au'),mp=$('#mp');if(AUDIO_SRC)au.src=AUDIO_SRC;
mp.addEventListener('click',()=>{if(!AUDIO_SRC){alert('Audio file abhi add nahi hui — AUDIO_SRC mein song ka path daal dein.');return}
 if(au.paused){au.play();mp.classList.add('playing');$('#pi').textContent='❚❚'}else{au.pause();mp.classList.remove('playing');$('#pi').textContent='▶'}});
</script>
</body></html>
